[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftomd-backend"
version = "0.1.0"
description = "PDF Slide Extractor — backend pipeline + FastAPI"
requires-python = ">=3.11"
dependencies = [
    # PDF processing
    "pdfplumber>=0.11.0",
    "Pillow>=10.0",
    "PyMuPDF>=1.24.0",       # fitz; rasterization fallback when poppler is unavailable
    # Web
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Validation / settings
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # LLM SDKs
    "anthropic>=0.40",
    "google-genai>=0.3",
    # google-genai uses google.api_core for typed exceptions (auth/quota/timeout
    # branching in providers/gemini.py). Not always pulled in transitively on a
    # clean install, so we declare it explicitly.
    "google-api-core>=2.15",
    "openai>=1.50",
    # google-genai uses google.api_core for typed exceptions (auth/quota/timeout
    # branching in providers/gemini.py). It is not always pulled in transitively
    # on a clean install, so we declare it explicitly.
    "google-api-core>=2.15",
    # Misc
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
pdftomd = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm_eval: tests that hit real LLM APIs (manual run only)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
